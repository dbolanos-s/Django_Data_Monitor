<div class="cards">

    <div class="card">
        <p class="card-label">Total de respuestas</p>
        <p class="card-value">{{ total_responses }}</p>
    </div>

    <div class="card">
        <p class="card-label">Usuarios registrados</p>
        <p class="card-value">{{ users }}</p>
    </div>

    <div class="card">
        <p class="card-label">Promedio por usuario</p>
        <p class="card-value">{{ average }}</p>
    </div>

    <div class="card">
        <p class="card-label">Mostrando</p>
        <p class="card-value">{{ posts|length }}</p>
    </div>

</div>

<div class="table-wrap">
    <table class="data-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Título</th>
                <th>Usuario</th>
            </tr>
        </thead>
        <tbody>
            {% for post in posts %}
            <tr>
                <td>{{ post.id }}</td>
                <td>{{ post.title }}</td>
                <td>{{ post.userId }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
