<div class="mb-8">
    <p class="text-sm font-medium">
        Backend Analytics Server
    </p>

    <h1 class="text-3xl font-bold">
        {{ title }}
    </h1>

    <p>
        Monitor de datos mediante Django y Server Side Rendering.
    </p>

    {% if user.is_authenticated %}
    <div class="mt-4">
        <span class="text-sm font-medium">Sesión iniciada como {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="mt-2 px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg">
                Cerrar sesión
            </button>
        </form>
    </div>
    {% endif %}
</div>
