<div class="page-header">
    <p class="placeholder-label">Backend Analytics Server</p>

    <h1>{{ title }}</h1>

    <p>Monitor de datos mediante Django y Server Side Rendering.</p>

    {% if user.is_authenticated %}
    <div class="user-box">
        <span>Sesión iniciada como <strong>{{ user.username }}</strong></span>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="logout-button">Cerrar sesión</button>
        </form>
    </div>
    {% endif %}
</div>
